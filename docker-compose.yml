services:
  postgres:
    image: postgres:17
    container_name: BAKLAVA-postgres
    environment:
      POSTGRES_USER: BAKLAVA
      POSTGRES_PASSWORD: BAKLAVA
      POSTGRES_DB: BAKLAVA
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U BAKLAVA -d BAKLAVA"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: BAKLAVA-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: BAKLAVA-api
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://BAKLAVA:BAKLAVA@postgres:5432/BAKLAVA
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data: